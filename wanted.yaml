# Images Claude wants in the media library.
# On every push, .github/workflows/fetch-media.yml downloads new entries into media/
# and records source/licence in media/CREDITS.md.
#
# Fields:
#   file:    target file name under media/ (lowercase, hyphens)
#   url:     direct download URL (for Unsplash: the URL returned by the connector's download_asset)
#   source:  unsplash | commons | other
#   page:    the photo's page (for credit and checking)
#   credit:  credit line
#   license: licence name
#   people:  none | unrecognisable | released   (released = model release confirmed, e.g. Unsplash+)

