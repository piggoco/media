name: Fetch sound trends

# Trending TikTok songs in Sweden, approved for business use (Creative Center).
# Runs Friday evening so the weekly routine has fresh data; can also be started by hand.
on:
  schedule:
    - cron: "17 19 * * 5"   # Fridays 19:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sound-trends
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - run: python scripts/probe_cc.py; python scripts/fetch_sound_trends.py

      - name: Commit trend files
        run: |
          git config user.name "piggo-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ljud
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Fetch TikTok sound trends"
            git pull --rebase
            git push
          fi
