name: Fetch media

on:
  push:
    paths:
      - wanted.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml pillow

      - run: python scripts/fetch_media.py

      - name: Commit new media
        run: |
          git config user.name "piggo-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Fetch media from wanted.yaml"
            git pull --rebase
            git push
          fi
